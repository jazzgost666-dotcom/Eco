<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eco</title>
<style>
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#040406;color:#E6E8EE;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,textarea{background:#12151D;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus,textarea:focus{border-color:rgba(255,255,255,.2)}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em}
.muted{color:#6B7285;font-size:13px}
.err{color:#F87171;font-size:13px;margin:6px 0}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;border:2px solid #0B0D12;background:#22C55E}
.dot.off{background:#4B5263}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;background:#1B2030;font-size:14px;font-weight:600}
.btn:hover{background:#242B3D}
.btn.primary{background:#6366F1;color:#fff}
.btn.primary:hover{background:#5558E3}
.btn.danger{background:#DC2626;color:#fff}
.btn.ok{background:#16A34A;color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#9AA1B2;font-size:17px}
.icon:hover{background:#181C26;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A1E2A;border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:12px;font-size:14px;z-index:300;max-width:90vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:100;padding:16px}
.modal{width:min(440px,100%);max-height:88vh;overflow:auto;background:#0B0D12;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#9AA1B2}
.field input,.field textarea{width:100%;color:#E6E8EE}
.row{display:flex;align-items:center;gap:10px}
.row-btns{display:flex;gap:8px;justify-content:flex-end}
.lbl{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:#1B2030;font-size:13px;font-weight:600;cursor:pointer}
.lbl:hover{background:#242B3D}
.lbl input{display:none}

/* auth */
.auth{height:100%;display:grid;place-items:center;padding:20px}
.card{width:min(400px,100%);background:#0B0D12;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:22px}
.card .sub{color:#6B7285;font-size:14px;margin:0}
.seg{display:flex;background:#12151D;border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:13px;color:#9AA1B2;font-weight:600}
.seg button.on{background:#6366F1;color:#fff}
.key{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.2em;text-align:center;background:#12151D;border-radius:12px;padding:14px;color:#A5B4FC}

/* layout */
.app{display:flex;height:100vh;width:100vw;overflow:hidden}
.rail{width:66px;flex:none;background:#07080B;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.rail .sp{width:44px;height:44px;border-radius:50%;background:#12151D;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.rail .sp.on,.rail .sp:hover{border-radius:15px;background:#6366F1}
.rail .eco{width:44px;height:44px;border-radius:14px;background:#6366F1;color:#fff;display:grid;place-items:center;font-size:20px}
.rail .spacer{margin-top:auto}
.side{width:280px;flex:none;background:#0B0D12;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;min-height:0}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 8px}
.side-head h2{margin:0;font-size:17px}
.side-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:12px;text-align:left}
.item:hover{background:#181C26}
.item.on{background:#1B2030}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:#6B7285;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#F43F5E;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#4B5263;padding:12px 10px 4px;font-weight:700}
.me-bar{border-top:1px solid rgba(255,255,255,.05);padding:10px;display:flex;align-items:center;gap:10px}
.me-bar .grow{flex:1;min-width:0}
.me-bar small{color:#6B7285;font-family:"JetBrains Mono",monospace;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#040406}
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);min-height:64px}
.head .grow{flex:1;min-width:0}
.head b{display:block;font-size:15px}
.head small{color:#6B7285;font-size:12px}
.callbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#12151D;font-size:17px}
.callbtn:hover{background:#1B2030}
.callbtn.green{background:#16A34A;color:#fff}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.empty{margin:auto;color:#6B7285;text-align:center;padding:30px;font-size:14px}
.msg{display:flex;flex-direction:column;max-width:70%;align-self:flex-start;gap:2px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:12px;color:#6B7285;margin:0 6px}
.bub{background:#12151D;border-radius:16px;padding:8px 12px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.msg.mine .bub{background:#6366F1;color:#fff}
.bub img{max-width:320px;max-height:320px;border-radius:10px;display:block}
.bub audio{width:240px;max-width:100%}
.bub a{color:#A5B4FC}
.time{font-size:11px;color:#4B5263;margin:0 6px}
.composer{padding:10px 14px 14px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:140px;border-radius:14px}
.rec{flex:1;display:flex;align-items:center;gap:10px;background:#12151D;border-radius:14px;padding:10px 14px;color:#F87171}
.dotrec{width:10px;height:10px;border-radius:50%;background:#F43F5E;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.modal-note{font-size:12px;color:#6B7285}
.code{font-family:"JetBrains Mono",monospace;background:#12151D;border-radius:8px;padding:2px 7px;font-size:12px}
.chanbtn{display:flex;align-items:center;gap:8px;width:calc(100% - 4px);margin:0 2px;padding:8px 10px;border-radius:9px;text-align:left;color:#9AA1B2;font-size:14px}
.chanbtn:hover{background:#181C26;color:#fff}
.chanbtn.on{background:#1B2030;color:#fff;font-weight:600}

/* incoming + call overlay */
.overlay{position:fixed;inset:0;background:#040406;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.overlay.light{background:rgba(4,4,6,.82);backdrop-filter:blur(6px)}
.overlay .name{font-size:24px;font-weight:700}
.overlay .sub{color:#9AA1B2;font-size:14px}
.big-av{width:132px;height:132px;font-size:48px;box-shadow:0 0 0 6px rgba(99,102,241,.18)}
.ring-btns{display:flex;gap:44px;margin-top:20px}
.round{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700}
.round.green{background:#16A34A}
.round.red{background:#DC2626}
.round small{position:absolute}
.roundwrap{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#9AA1B2}
.stage{position:relative;width:min(900px,100%);height:min(560px,68vh);background:#07080B;border-radius:20px;overflow:hidden;display:grid;place-items:center}
.stage video.remote{width:100%;height:100%;object-fit:cover;background:#000}
.stage video.local{position:absolute;right:14px;bottom:14px;width:180px;height:120px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:#000}
.ctrls{display:flex;gap:14px;align-items:center}
.ctrl{width:54px;height:54px;border-radius:50%;background:#1B2030;display:grid;place-items:center;font-size:20px;color:#fff}
.ctrl.off{background:#F43F5E}
.ctrl.hang{background:#DC2626}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;

/* ============ utilitários ============ */
async function api(action,body={}){
  const tok=localStorage.getItem('eco:token')||'';
  const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Erro');
  return j;
}
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
function resizeImage(dataUrl,max,q){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};
    im.onerror=()=>res(dataUrl);
    im.src=dataUrl;
  });
}
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const fmtTime=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const REASON={declined:'Chamada recusada',timeout:'Sem resposta',hangup:'Chamada encerrada',cancelled:'Chamada cancelada',offline:'Conexão com o contato perdida'};
const keyOf=c=>!c?null:c.kind==='dm'?'dm:'+c.peer.id:'sp:'+c.space.id+':'+c.channel.id;
function notify(title,body){
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body,tag:'eco'})}catch(e){}}
}
function Avatar({p,size=40}){
  const h=hue(p&&p.id||'x');
  return <div className="av" style={{width:size,height:size,fontSize:Math.round(size*0.36),background:p&&p.avatar?'#000':`linear-gradient(135deg,hsl(${h} 55% 42%),hsl(${(h+40)%360} 50% 24%))`}}>
    {p&&p.avatar?<img src={p.avatar} alt=""/>:initials(p&&p.name)}
  </div>;
}

/* ---- toque padrão (quando o usuário não envia o próprio) ---- */
let audioCtx=null;
function beepOnce(){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[660,0.25]].forEach(([f,o])=>{
      const t=audioCtx.currentTime+o;const g=audioCtx.createGain();const os=audioCtx.createOscillator();
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      os.frequency.value=f;os.connect(g).connect(audioCtx.destination);os.start(t);os.stop(t+0.22);
    });
  }catch(e){}
}

/* ============ tela de entrada ============ */
function AuthScreen({onDone}){
  const [mode,setMode]=useState('register');
  const [name,setName]=useState('');
  const [uname,setUname]=useState('');
  const [id,setId]=useState('');
  const [rec,setRec]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [created,setCreated]=useState(null);
  const submit=async e=>{
    e.preventDefault();setErr('');setBusy(true);
    try{
      if(mode==='register'){
        const r=await api('register',{name:name.trim(),username:uname.trim()});
        localStorage.setItem('eco:token',r.token);
        setCreated(r);
      }else{
        const r=await api('login',{id:id.trim(),recovery:rec.trim()});
        localStorage.setItem('eco:token',r.token);
        onDone(r);
      }
    }catch(ex){setErr(ex.message)}
    finally{setBusy(false)}
  };
  if(created)return <div className="auth"><div className="card">
    <h2>Conta criada</h2>
    <p className="sub">Seu ID é <code className="code">{created.me.id}</code>. Outras pessoas adicionam você por ele.</p>
    <p className="sub">Guarde esta chave de recuperação. Ela aparece só agora e é necessária para entrar em outro aparelho com seu ID:</p>
    <div className="key">{created.recovery}</div>
    <button className="btn primary wide" onClick={()=>onDone(created)}>Já guardei, entrar</button>
  </div></div>;
  return <div className="auth"><form className="card" onSubmit={submit}>
    <h2>Eco</h2>
    <div className="seg">
      <button type="button" className={mode==='register'?'on':''} onClick={()=>setMode('register')}>Criar conta</button>
      <button type="button" className={mode==='login'?'on':''} onClick={()=>setMode('login')}>Entrar</button>
    </div>
    {mode==='register'?<Fragment2>
      <label className="field">Seu nome<input value={name} maxLength={40} onChange={e=>setName(e.target.value)} required autoFocus/></label>
      <label className="field">@usuário (opcional)<input value={uname} maxLength={24} onChange={e=>setUname(e.target.value)} placeholder="ex.: ana.lua"/></label>
    </Fragment2>:<Fragment2>
      <label className="field">Seu ID<input value={id} onChange={e=>setId(e.target.value)} placeholder="ECO#1234" required autoFocus/></label>
      <label className="field">Chave de recuperação<input value={rec} onChange={e=>setRec(e.target.value)} required/></label>
    </Fragment2>}
    {err&&<div className="err">{err}</div>}
    <button className="btn primary wide" disabled={busy}>{mode==='register'?'Criar conta':'Entrar'}</button>
  </form></div>;
}
function Fragment2({children}){return <>{children}</>}

/* ============ modais ============ */
function AddModal({api2,onClose,onAdded,flash}){
  const [q,setQ]=useState('');
  const [res,setRes]=useState(null);
  const [err,setErr]=useState('');
  const search=async e=>{
    e.preventDefault();setErr('');setRes(null);
    try{const r=await api('find',{q:q.trim()});if(r.self)setErr('Este é o seu próprio ID.');else if(!r.user)setErr('Nenhum usuário com este ID ou @usuário.');else setRes(r.user);}
    catch(ex){setErr(ex.message)}
  };
  const add=async()=>{
    try{const r=await api('addContact',{id:res.id});onAdded(r.contacts);flash('Contato adicionado');onClose();}
    catch(ex){setErr(ex.message)}
  };
  return <div className="modal-back" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><div className="modal">
    <h3>Adicionar por ID</h3>
    <form onSubmit={search} className="row"><input style={{flex:1}} autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="ECO#1234 ou @usuario"/><button className="btn primary">Buscar</button></form>
    {err&&<div className="err">{err}</div>}
    {res&&<div className="item" style={{cursor:'default'}}><Avatar p={res} size={44}/><div className="grow"><b>{res.name}</b><small>@{res.username} · {res.id}</small></div><button className="btn primary" onClick={add}>Adicionar</button></div>}
    <div className="row-btns"><button className="btn" onClick={onClose}>Fechar</button></div>
  </div></div>;
}

function SpaceModal({onClose,onDone,flash}){
  const [mode,setMode]=useState('create');
  const [name,setName]=useState('');
  const [desc,setDesc]=useState('');
  const [code,setCode]=useState('');
  const [err,setErr]=useState('');
  const submit=async e=>{
    e.preventDefault();setErr('');
    try{
      if(mode==='create'){await api('createSpace',{name:name.trim(),desc:desc.trim()});flash('Eco criado');}
      else{await api('joinSpace',{code:code.trim().toUpperCase()});flash('Você entrou no Eco');}
      onDone();onClose();
    }catch(ex){setErr(ex.message)}
  };
  return <div className="modal-back" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><form className="modal" onSubmit={submit}>
    <h3>Ecos</h3>
    <div className="seg">
      <button type="button" className={mode==='create'?'on':''} onClick={()=>setMode('create')}>Criar</button>
      <button type="button" className={mode==='join'?'on':''} onClick={()=>setMode('join')}>Entrar com código</button>
    </div>
    {mode==='create'?<>
      <label className="field">Nome<input value={name} maxLength={40} onChange={e=>setName(e.target.value)} required autoFocus/></label>
      <label className="field">Descrição<textarea value={desc} maxLength={120} onChange={e=>setDesc(e.target.value)}/></label>
      <p className="modal-note">Canais #geral e #mídia são criados automaticamente. Todos os membros são iguais.</p>
    </>:<>
      <label className="field">Código de convite<input value={code} onChange={e=>setCode(e.target.value)} placeholder="ECO-XXXX-XXXX" required autoFocus/></label>
    </>}
    {err&&<div className="err">{err}</div>}
    <div className="row-btns"><button type="button" className="btn" onClick={onClose}>Cancelar</button><button className="btn primary">{mode==='create'?'Criar':'Entrar'}</button></div>
  </form></div>;
}

function ProfileModal({me,setMe,onClose,onLogout,flash}){
  const [name,setName]=useState(me.name);
  const [uname,setUname]=useState(me.username);
  const [bio,setBio]=useState(me.bio||'');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const save=async()=>{
    setErr('');setBusy(true);
    try{const r=await api('profile',{name:name.trim(),username:uname.trim(),bio});setMe(r.me);flash('Perfil salvo');}
    catch(ex){setErr(ex.message)}
    finally{setBusy(false)}
  };
  const pickAvatar=async f=>{
    if(!f||!f.type.startsWith('image/'))return setErr('Escolha uma imagem');
    try{
      const data=f.type==='image/gif'?await readFile(f):await resizeImage(await readFile(f),384,0.85);
      const r=await api('profile',{avatar:data});setMe(r.me);flash('Foto atualizada');
    }catch(ex){setErr(ex.message)}
  };
  const pickRingtone=async f=>{
    if(!f||!f.type.startsWith('audio/'))return setErr('Escolha um arquivo de áudio (mp3, wav, ogg, m4a)');
    setErr('');
    const url=URL.createObjectURL(f);
    const probe=new Audio(url);
    probe.onloadedmetadata=async()=>{
      URL.revokeObjectURL(url);
      if(!(probe.duration>0)||probe.duration>5.05)return setErr('O toque precisa ter no máximo 5 segundos (este tem '+(probe.duration||0).toFixed(1)+' s).');
      try{
        const data=await readFile(f);
        const r=await api('profile',{ringtone:data});setMe(r.me);flash('Toque salvo');
      }catch(ex){setErr(ex.message)}
    };
    probe.onerror=()=>{URL.revokeObjectURL(url);setErr('Não foi possível ler este áudio')};
  };
  const removeRingtone=async()=>{try{const r=await api('profile',{ringtone:null});setMe(r.me)}catch(ex){setErr(ex.message)}};
  const removeAvatar=async()=>{try{const r=await api('profile',{avatar:null});setMe(r.me)}catch(ex){setErr(ex.message)}};
  const previewRing=()=>{if(me.ringtone){const a=new Audio(me.ringtone);a.play().catch(()=>{});setTimeout(()=>a.pause(),5200)}};
  return <div className="modal-back" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}}><div className="modal">
    <h3>Meu perfil</h3>
    <div className="row"><Avatar p={me} size={64}/><div style={{display:'flex',flexDirection:'column',gap:6}}>
      <label className="lbl">Trocar foto<input type="file" accept="image/*" onChange={e=>{pickAvatar(e.target.files[0]);e.target.value=''}}/></label>
      {me.avatar&&<button className="btn" onClick={removeAvatar}>Remover foto</button>}
    </div></div>
    <label className="field">Nome<input value={name} maxLength={40} onChange={e=>setName(e.target.value)}/></label>
    <label className="field">@usuário<input value={uname} maxLength={24} onChange={e=>setUname(e.target.value)}/></label>
    <label className="field">Bio<textarea rows={2} maxLength={240} value={bio} onChange={e=>setBio(e.target.value)}/></label>
    <button className="btn primary" disabled={busy} onClick={save}>Salvar</button>
    <div className="field">Toque de chamada (máximo 5 segundos, toca em loop quando alguém te liga)
      <div className="row">
        <label className="lbl">{me.ringtone?'Trocar toque':'Enviar toque'}<input type="file" accept="audio/*" onChange={e=>{pickRingtone(e.target.files[0]);e.target.value=''}}/></label>
        {me.ringtone&&<><button className="btn" onClick={previewRing}>Ouvir</button><button className="btn" onClick={removeRingtone}>Remover</button></>}
        {!me.ringtone&&<span className="muted">usando toque padrão</span>}
      </div>
    </div>
    <div className="field">Seu ID<div className="row"><span className="code">{me.id}</span><button className="btn" onClick={()=>navigator.clipboard&&navigator.clipboard.writeText(me.id).then(()=>flash('ID copiado'))}>Copiar</button></div></div>
    <div className="field">Notificações quando a aba está em segundo plano<button className="btn" onClick={()=>{if('Notification' in window)Notification.requestPermission().then(p=>flash(p==='granted'?'Notificações ativadas':'Permissão negada no navegador'))}}>Ativar notificações</button></div>
    {err&&<div className="err">{err}</div>}
    <div className="row-btns"><button className="btn danger" onClick={onLogout}>Sair da conta</button><button className="btn" onClick={onClose}>Fechar</button></div>
  </div></div>;
}

/* ============ chamada: sobreposição ============ */
function CallOverlay({call,onHang,onToggleMic,onToggleCam,micOn,camOn}){
  const rv=useRef(null),lv=useRef(null);
  const status={calling:'Chamando…',connecting:'Conectando…',connected:'Em chamada'}[call.state]||'';
  const hasRemoteVideo=!!(call.video&&call.remote&&call.remote.getVideoTracks().length);
  useEffect(()=>{if(rv.current&&rv.current.srcObject!==(call.remote||null))rv.current.srcObject=call.remote||null});
  useEffect(()=>{if(lv.current&&lv.current.srcObject!==(call.local||null))lv.current.srcObject=call.local||null});
  return <div className="overlay">
    {!hasRemoteVideo&&<>
      <Avatar p={call.peer} size={132}/>
      <div className="name">{call.peer.name}</div>
      <div className="sub">{status}</div>
    </>}
    {hasRemoteVideo&&<div className="stage">
      <video ref={rv} className="remote" autoPlay playsInline/>
      {call.local&&call.video&&<video ref={lv} className="local" autoPlay playsInline muted/>}
    </div>}
    {!hasRemoteVideo&&<video ref={rv} autoPlay playsInline className="hidden"/>}
    {hasRemoteVideo&&<div className="sub">{call.peer.name} · {status}</div>}
    <div className="ctrls">
      <button className={'ctrl'+(micOn?'':' off')} title="Microfone" onClick={onToggleMic}>{micOn?'🎙':'🔇'}</button>
      {call.video&&<button className={'ctrl'+(camOn?'':' off')} title="Câmera" onClick={onToggleCam}>{camOn?'📷':'🚫'}</button>}
      <button className="ctrl hang" title={call.state==='calling'?'Cancelar':'Desligar'} onClick={onHang}>✕</button>
    </div>
    {!hasRemoteVideo&&call.local&&call.video&&<video ref={lv} className="local" style={{position:'static',width:200,height:140}} autoPlay playsInline muted/>}
  </div>;
}

function IncomingOverlay({inc,onAccept,onDecline}){
  return <div className="overlay light">
    <Avatar p={inc.from} size={132}/>
    <div className="name">{inc.from.name}</div>
    <div className="sub">@{inc.from.username} · {inc.video?'chamada de vídeo':'chamada de voz'}</div>
    <div className="ring-btns">
      <div className="roundwrap"><button className="round red" onClick={onDecline} aria-label="Recusar">✕</button>Recusar</div>
      <div className="roundwrap"><button className="round green" onClick={onAccept} aria-label="Aceitar">✓</button>Aceitar</div>
    </div>
  </div>;
}

/* ============ aplicação ============ */
function App(){
  const [me,setMe]=useState(null);
  const [booting,setBooting]=useState(true);
  const [newAcc,setNewAcc]=useState(null);
  const [contacts,setContacts]=useState([]);
  const [spaces,setSpaces]=useState([]);
  const [online,setOnline]=useState(new Set());
  const [msgs,setMsgs]=useState({});
  const [unread,setUnread]=useState({});
  const [chat,setChat]=useState(null);
  const [typing,setTyping]=useState({});
  const [incoming,setIncoming]=useState(null);
  const [call,setCall]=useState(null);
  const [modal,setModal]=useState(null);
  const [toast,setToast]=useState(null);
  const [draft,setDraft]=useState('');
  const [recording,setRecording]=useState(null);
  const [micOn,setMicOn]=useState(true);
  const [camOn,setCamOn]=useState(true);
  const [chatErr,setChatErr]=useState('');

  const callRef=useRef({});            // estado de chamada que não precisa re-renderizar
  const pendingIce=useRef({});         // ICE que chega antes da chamada existir localmente
  const ringRef=useRef({audio:null,timer:null});
  const meRef=useRef(null);meRef.current=me;
  const incRef=useRef(null);incRef.current=incoming;
  const chatRef=useRef(null);chatRef.current=chat;
  const handlerRef=useRef(null);
  const recRef=useRef(null);
  const fileRef=useRef(null);
  const lastTypingSent=useRef(0);
  const endRef=useRef(null);

  const flash=useCallback(m=>setToast({m,id:Math.random()}),[]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),3000);return()=>clearTimeout(t)},[toast]);

  /* ---- entrada e sessão ---- */
  useEffect(()=>{
    const tok=localStorage.getItem('eco:token');
    if(!tok){setBooting(false);return}
    api('me').then(r=>{setMe(r.me);setContacts(r.contacts);setSpaces(r.spaces)})
      .catch(()=>localStorage.removeItem('eco:token'))
      .finally(()=>setBooting(false));
  },[]);
  const enter=r=>{setMe(r.me);setContacts(r.contacts);setSpaces(r.spaces);setNewAcc(null)};

  const logout=async()=>{
    try{await api('logout',{token:localStorage.getItem('eco:token')})}catch(e){}
    localStorage.removeItem('eco:token');
    setMe(null);setModal(null);setChat(null);setMsgs({});setContacts([]);setSpaces([]);
  };

  /* ---- toque de chamada ---- */
  const stopRing=()=>{
    const r=ringRef.current;
    if(r.audio){r.audio.pause();r.audio=null}
    if(r.timer){clearInterval(r.timer);r.timer=null}
  };
  const startRing=()=>{
    stopRing();
    const r=ringRef.current;
    const url=meRef.current&&meRef.current.ringtone;
    if(url){
      r.audio=new Audio(url);r.audio.loop=true;
      r.audio.play().catch(()=>{});
    }else{
      beepOnce();r.timer=setInterval(beepOnce,1800);
    }
  };

  /* ---- chamadas WebRTC ---- */
  const sendIce=(callId,p)=>api('signal',{callId,kind:'ice',payload:p}).catch(()=>{});
  const addIce=(c,p)=>{
    if(c.pc&&c.pc.remoteDescription)c.pc.addIceCandidate(p).catch(()=>{});
    else c.pendingIce.push(p);
  };
  const flushIce=c=>{
    const list=c.pendingIce.splice(0);
    list.forEach(p=>c.pc.addIceCandidate(p).catch(()=>{}));
  };
  const makePc=c=>{
    const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    pc.onicecandidate=ev=>{
      if(!ev.candidate)return;
      const p=ev.candidate.toJSON();
      if(c.callId)sendIce(c.callId,p);else c.outIce.push(p);
    };
    pc.ontrack=ev=>{setCall(s=>s?{...s,remote:ev.streams[0]}:s)};
    pc.onconnectionstatechange=()=>{
      if(pc.connectionState==='connected')setCall(s=>s?{...s,state:'connected'}:s);
      if(pc.connectionState==='failed')flash('A conexão com o contato falhou (redes muito restritas podem exigir um servidor TURN)');
    };
    return pc;
  };
  const cleanupCall=reason=>{
    const c=callRef.current;
    if(c.local)c.local.getTracks().forEach(t=>t.stop());
    try{c.pc&&c.pc.close()}catch(e){}
    callRef.current={};
    setCall(null);setMicOn(true);setCamOn(true);
    if(reason)flash(reason);
  };
  const getMedia=video=>navigator.mediaDevices.getUserMedia({audio:true,video});

  const startCall=async(peer,video)=>{
    if(callRef.current.pc||incRef.current)return flash('Você já está em uma chamada');
    let local;
    try{local=await getMedia(video)}
    catch(ex){return flash('Não foi possível acessar '+(video?'a câmera e o microfone':'o microfone')+'. Permita o acesso no navegador.')}
    const c={pc:null,peer,video,local,remote:null,callId:null,pendingIce:[],outIce:[],role:'caller'};
    callRef.current=c;
    const pc=makePc(c);c.pc=pc;
    local.getTracks().forEach(t=>pc.addTrack(t,local));
    setCall({state:'calling',peer,video,local,remote:null});
    try{
      const offer=await pc.createOffer();
      await pc.setLocalDescription(offer);
      const r=await api('call',{to:peer.id,video,sdp:offer.sdp});
      if(!r.ok){
        cleanupCall(r.reason==='offline'?'Este contato está offline agora':r.reason==='busy'?'Este contato está em outra chamada':'Não foi possível ligar');
        return;
      }
      c.callId=r.callId;
      c.outIce.splice(0).forEach(p=>sendIce(c.callId,p));
    }catch(ex){cleanupCall(ex.message)}
  };

  const acceptCall=async()=>{
    const inc=incRef.current;
    if(!inc)return;
    stopRing();setIncoming(null);
    let local;
    try{local=await getMedia(inc.video)}
    catch(ex){
      await api('signal',{callId:inc.callId,kind:'decline'}).catch(()=>{});
      return flash('Sem acesso ao microfone'+(inc.video?' ou câmera':'')+'. Chamada recusada.');
    }
    const c={pc:null,peer:inc.from,video:inc.video,local,remote:null,callId:inc.callId,pendingIce:pendingIce.current[inc.callId]||[],outIce:[],role:'callee'};
    delete pendingIce.current[inc.callId];
    callRef.current=c;
    const pc=makePc(c);c.pc=pc;
    local.getTracks().forEach(t=>pc.addTrack(t,local));
    setCall({state:'connecting',peer:inc.from,video:inc.video,local,remote:null});
    try{
      await pc.setRemoteDescription({type:'offer',sdp:inc.sdp});
      flushIce(c);
      await api('signal',{callId:inc.callId,kind:'accept'});
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await api('signal',{callId:inc.callId,kind:'answer',payload:{sdp:answer.sdp}});
    }catch(ex){cleanupCall('Falha ao conectar: '+ex.message)}
  };

  const declineCall=()=>{
    const inc=incRef.current;
    stopRing();setIncoming(null);
    if(inc)api('signal',{callId:inc.callId,kind:'decline'}).catch(()=>{});
  };

  const hangUp=()=>{
    const c=callRef.current;
    const ringing=call&&call.state==='calling';
    if(c.callId)api('signal',{callId:c.callId,kind:ringing?'cancel':'hangup'}).catch(()=>{});
    cleanupCall();
  };
  const toggleMic=()=>{
    const c=callRef.current;const on=!micOn;
    if(c.local)c.local.getAudioTracks().forEach(t=>t.enabled=on);
    setMicOn(on);
  };
  const toggleCam=()=>{
    const c=callRef.current;const on=!camOn;
    if(c.local)c.local.getVideoTracks().forEach(t=>t.enabled=on);
    setCamOn(on);
  };

  /* ---- eventos em tempo real (SSE) ---- */
  const addMsg=(key,msg)=>{
    setMsgs(m=>{const list=m[key]||[];if(list.some(x=>x.id===msg.id))return m;return{...m,[key]:[...list,msg]}});
    const mine=meRef.current&&msg.from===meRef.current.id;
    if(!mine){
      if(keyOf(chatRef.current)!==key)setUnread(u=>({...u,[key]:(u[key]||0)+1}));
      notify('Eco', msg.type==='text'?msg.text.slice(0,80):'Nova mídia');
    }
  };
  handlerRef.current=evt=>{
    switch(evt.t){
      case 'presence':setOnline(new Set(evt.online));break;
      case 'userUpdate':setContacts(cs=>cs.map(c=>c.id===evt.user.id?{...c,...evt.user}:c));break;
      case 'contacts':setContacts(evt.contacts);break;
      case 'spaces':setSpaces(evt.spaces);break;
      case 'dmMsg':case 'spMsg':addMsg(evt.key,evt.msg);break;
      case 'typing':setTyping(t=>({...t,[evt.from]:Date.now()}));break;
      case 'ring':{
        if(callRef.current.pc||incRef.current){api('signal',{callId:evt.callId,kind:'decline'}).catch(()=>{});break}
        setIncoming({callId:evt.callId,from:evt.from,video:evt.video,sdp:evt.sdp});
        startRing();
        notify('Chamada de '+evt.from.name,evt.video?'Chamada de vídeo':'Chamada de voz');
        break;
      }
      case 'signal':{
        const c=callRef.current;
        if(evt.kind==='accept'){if(c.callId===evt.callId)setCall(s=>s?{...s,state:'connecting'}:s);break}
        if(evt.kind==='answer'){
          if(c.callId!==evt.callId||!c.pc)break;
          c.pc.setRemoteDescription({type:'answer',sdp:evt.payload.sdp}).then(()=>flushIce(c)).catch(()=>{});
          break;
        }
        if(evt.kind==='ice'){
          if(c.callId===evt.callId&&c.pc)addIce(c,evt.payload);
          else (pendingIce.current[evt.callId]=pendingIce.current[evt.callId]||[]).push(evt.payload);
        }
        break;
      }
      case 'callEnd':{
        if(incRef.current&&incRef.current.callId===evt.callId){stopRing();setIncoming(null);flash(REASON[evt.reason]||'Chamada encerrada')}
        if(callRef.current.callId===evt.callId)cleanupCall(REASON[evt.reason]||'Chamada encerrada');
        break;
      }
    }
  };
  useEffect(()=>{
    if(!me)return;
    const tok=localStorage.getItem('eco:token');
    const es=new EventSource('/events?token='+encodeURIComponent(tok));
    es.onmessage=ev=>{try{handlerRef.current(JSON.parse(ev.data))}catch(e){}};
    return()=>es.close();
  },[me&&me.id]);

  /* ---- conversa atual ---- */
  const curKey=keyOf(chat);
  useEffect(()=>{
    if(!chat||!curKey)return;
    setUnread(u=>({...u,[curKey]:0}));
    setChatErr('');
    const req=chat.kind==='dm'?api('dmHistory',{with:chat.peer.id}):api('spaceHistory',{spaceId:chat.space.id,channelId:chat.channel.id});
    req.then(r=>setMsgs(m=>({...m,[curKey]:r.msgs}))).catch(ex=>setChatErr(ex.message));
  },[curKey]);
  useEffect(()=>{endRef.current&&endRef.current.scrollIntoView({block:'end'})},[msgs,curKey]);

  const people=id=>{
    if(me&&id===me.id)return me;
    const c=contacts.find(x=>x.id===id);if(c)return c;
    for(const s of spaces){const m=s.members.find(x=>x.id===id);if(m)return m}
    return{id,name:id,username:''};
  };

  const sendMsg=async msg=>{
    if(!chat)return;
    try{
      if(chat.kind==='dm')await api('dmSend',{to:chat.peer.id,msg});
      else await api('spaceSend',{spaceId:chat.space.id,channelId:chat.channel.id,msg});
    }catch(ex){flash(ex.message)}
  };
  const sendText=()=>{
    const t=draft.trim();if(!t)return;
    setDraft('');sendMsg({type:'text',text:t});
  };
  const sendTyping=()=>{
    if(!chat||chat.kind!=='dm')return;
    const now=Date.now();
    if(now-lastTypingSent.current>2000){lastTypingSent.current=now;api('typing',{to:chat.peer.id}).catch(()=>{})}
  };
  const attachImage=async f=>{
    if(!f||!f.type.startsWith('image/'))return flash('Escolha uma imagem');
    try{
      const data=f.type==='image/gif'?await readFile(f):await resizeImage(await readFile(f),1600,0.85);
      sendMsg({type:f.type==='image/gif'?'gif':'image',media:data,text:''});
    }catch(ex){flash('Falha ao carregar a imagem')}
  };
  const onPaste=e=>{
    const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(i=>i.type.startsWith('image/'));
    if(it){e.preventDefault();attachImage(it.getAsFile())}
  };
  const startRecording=async()=>{
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(ex){return flash('Microfone indisponível. Permita o acesso ao microfone no navegador.')}
    const rec={stream,chunks:[],started:Date.now(),mr:null};
    try{rec.mr=new MediaRecorder(stream)}catch(ex){stream.getTracks().forEach(t=>t.stop());return flash('Este navegador não consegue gravar áudio')}
    rec.mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)rec.chunks.push(ev.data)};
    rec.mr.start(250);
    recRef.current=rec;
    setRecording({started:rec.started,tick:0});
    const iv=setInterval(()=>setRecording(r=>r?{...r,tick:r.tick+1}:r),500);
    rec.iv=iv;
  };
  const stopRecording=(send)=>{
    const rec=recRef.current;if(!rec)return;
    recRef.current=null;clearInterval(rec.iv);
    const dur=Math.max(1,Math.round((Date.now()-rec.started)/1000));
    setRecording(null);
    const done=()=>rec.stream.getTracks().forEach(t=>t.stop());
    if(rec.mr.state==='inactive'){done();return}
    rec.mr.onstop=async()=>{
      done();
      if(!send||!rec.chunks.length)return;
      try{
        const blob=new Blob(rec.chunks,{type:rec.mr.mimeType||'audio/webm'});
        const data=await readFile(blob);
        sendMsg({type:'audio',media:data,duration:dur,text:''});
      }catch(ex){flash('Falha ao salvar o áudio')}
    };
    rec.mr.stop();
  };

  /* ---- Ecos (grupos) ---- */
  const refreshSpaces=()=>api('me').then(r=>setSpaces(r.spaces)).catch(()=>{});
  const addChannel=async()=>{
    if(!chat||chat.kind!=='sp')return;
    const name=prompt('Nome do novo canal (ex.: ideias)');
    if(!name||!name.trim())return;
    try{await api('addChannel',{spaceId:chat.space.id,name:name.trim()});}
    catch(ex){flash(ex.message)}
  };
  const leaveSpace=async s=>{
    if(!confirm('Sair de "'+s.name+'"?'))return;
    try{await api('leaveSpace',{id:s.id});setChat(null);refreshSpaces();}
    catch(ex){flash(ex.message)}
  };

  /* ---- render ---- */
  useEffect(()=>{
    if(!chat&&contacts.length)setChat({kind:'dm',peer:contacts[0]});
  },[contacts.length]);

  if(booting)return <div className="auth muted">Carregando…</div>;
  if(newAcc)return <AuthScreen onDone={enter}/>;
  if(!me)return <AuthScreen onDone={enter}/>;

  const curSpace=chat&&chat.kind==='sp'?spaces.find(s=>s.id===chat.space.id):null;
  const list=curKey&&msgs[curKey]||[];
  const typingNow=chat&&chat.kind==='dm'&&typing[chat.peer.id]&&Date.now()-typing[chat.peer.id]<3000;
  const peerOnline=chat&&chat.kind==='dm'&&online.has(chat.peer.id);
  const inCall=!!call;

  return <div className="app">
    <nav className="rail">
      <button className="eco" title="Conversas" onClick={()=>{setChat(contacts[0]?{kind:'dm',peer:contacts[0]}:null)}}>☾</button>
      {spaces.map(s=><button key={s.id} className={'sp'+(chat&&chat.kind==='sp'&&chat.space.id===s.id?' on':'')} title={s.name}
        onClick={()=>{const ch=s.channels[0];setChat({kind:'sp',space:s,channel:ch})}}>{s.name.slice(0,2).toUpperCase()}</button>)}
      <button className="sp" title="Criar ou entrar em Eco" onClick={()=>setModal('space')}>+</button>
      <div className="spacer"/>
      <button className="sp" title="Meu perfil" onClick={()=>setModal('profile')}>{initials(me.name)}</button>
    </nav>

    <aside className="side">
      {!curSpace&&<>
        <div className="side-head"><h2>Conversas</h2><button className="btn" onClick={()=>setModal('add')}>+ ID</button></div>
        <div className="side-scroll">
          {contacts.length===0&&<div className="empty" style={{margin:'20px auto'}}>Nenhum contato ainda.<br/>Toque em “+ ID” e adicione alguém pelo ID dela.</div>}
          {contacts.map(c=>{const k='dm:'+c.id;const isOn=chat&&chat.kind==='dm'&&chat.peer.id===c.id;return <button key={c.id} className={'item'+(isOn?' on':'')} onClick={()=>setChat({kind:'dm',peer:c})}>
            <div style={{position:'relative'}}><Avatar p={c} size={42}/><span className={'dot'+(online.has(c.id)?'':' off')}/></div>
            <div className="grow"><b>{c.name}</b><small>@{c.username} · {c.id}</small></div>
            {unread[k]>0&&<span className="badge">{unread[k]}</span>}
          </button>})}
        </div>
      </>}
      {curSpace&&<>
        <div className="side-head"><h2>{curSpace.name}</h2></div>
        <div className="side-scroll">
          <div className="label">Canais de texto</div>
          {curSpace.channels.map(ch=><button key={ch.id} className={'chanbtn'+(chat.channel.id===ch.id?' on':'')} onClick={()=>setChat({kind:'sp',space:curSpace,channel:ch})}># {ch.name}</button>)}
          <button className="chanbtn" onClick={addChannel}>+ criar canal</button>
          <div className="label">Código de convite</div>
          <div className="row" style={{padding:'0 10px'}}><span className="code">{curSpace.code}</span>
            <button className="btn" onClick={()=>navigator.clipboard&&navigator.clipboard.writeText(curSpace.code).then(()=>flash('Código copiado'))}>Copiar</button></div>
          <div className="label">Membros · {curSpace.members.length}</div>
          {curSpace.members.map(m=><div key={m.id} className="item" style={{cursor:'default'}}><Avatar p={m} size={30}/><div className="grow"><b>{m.id===me.id?'Você':m.name}</b><small>{m.id}</small></div></div>)}
          <div style={{padding:'10px'}}><button className="btn danger" onClick={()=>leaveSpace(curSpace)}>Sair do Eco</button></div>
        </div>
      </>}
      <div className="me-bar" style={{cursor:"pointer"}} title="Meu perfil" onClick={()=>setModal("profile")}>
        <Avatar p={me} size={34}/>
        <div className="grow"><b style={{fontSize:14}}>{me.name}</b><small>{me.id}</small></div>
      </div>
    </aside>

    <main className="main">
      {!chat&&<div className="empty">Escolha uma conversa à esquerda, ou adicione um contato pelo ID.</div>}
      {chat&&<>
        <header className="head">
          {chat.kind==='dm'?<>
            <Avatar p={chat.peer} size={40}/>
            <div className="grow"><b>{chat.peer.name}</b><small>{typingNow?'digitando…':peerOnline?'online':'offline'} · {chat.peer.id}</small></div>
            <button className="callbtn" title="Chamada de voz" onClick={()=>startCall(chat.peer,false)} disabled={inCall}>📞</button>
            <button className="callbtn" title="Chamada de vídeo" onClick={()=>startCall(chat.peer,true)} disabled={inCall}>📹</button>
          </>:<>
            <div className="grow"><b># {chat.channel.name}</b><small>{curSpace?curSpace.name:''} · {curSpace?curSpace.members.length:0} membros</small></div>
          </>}
        </header>

        <div className="feed" onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();attachImage(e.dataTransfer.files[0])}}>
          {chatErr&&<div className="err">{chatErr}</div>}
          {list.length===0&&!chatErr&&<div className="empty">Nenhuma mensagem ainda. Envie texto, foto, GIF ou áudio.</div>}
          {list.map(m=>{
            const mine=m.from===me.id;
            const p=people(m.from);
            return <div key={m.id} className={'msg'+(mine?' mine':'')}>
              {!mine&&<span className="who">{p.name}</span>}
              <div className="bub">
                {m.type==='text'&&m.text}
                {(m.type==='image'||m.type==='gif')&&<img src={m.media} alt=""/>}
                {m.type==='audio'&&<audio controls src={m.media}/>}
              </div>
              <span className="time">{fmtTime(m.ts)}</span>
            </div>;
          })}
          <div ref={endRef}/>
        </div>

        <div className="composer">
          {recording?<div className="rec">
            <span className="dotrec"/><span style={{flex:1}}>Gravando… {fmtTime2(Math.floor((Date.now()-recording.started)/1000))}</span>
            <button className="btn" onClick={()=>stopRecording(false)}>Cancelar</button>
            <button className="btn ok" onClick={()=>stopRecording(true)}>Enviar</button>
          </div>:<>
            <label className="icon lbl" title="Enviar foto ou GIF" style={{padding:0}}>📎<input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{attachImage(e.target.files[0]);e.target.value=''}}/></label>
            <textarea rows={1} value={draft} placeholder={chat.kind==='dm'?'Mensagem para '+chat.peer.name:'Mensagem em #'+chat.channel.name}
              onChange={e=>{setDraft(e.target.value);sendTyping()}}
              onPaste={onPaste}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}}}/>
            {draft.trim()
              ?<button className="btn primary" onClick={sendText}>Enviar</button>
              :<button className="btn" title="Gravar áudio" onClick={startRecording}>🎤</button>}
          </>}
        </div>
      </>}
    </main>

    {incoming&&!call&&<IncomingOverlay inc={incoming} onAccept={acceptCall} onDecline={declineCall}/>}
    {call&&<CallOverlay call={call} onHang={hangUp} onToggleMic={toggleMic} onToggleCam={toggleCam} micOn={micOn} camOn={camOn}/>}
    {modal==='add'&&<AddModal onClose={()=>setModal(null)} onAdded={cs=>setContacts(cs)} flash={flash}/>}
    {modal==='space'&&<SpaceModal onClose={()=>setModal(null)} onDone={refreshSpaces} flash={flash}/>}
    {modal==='profile'&&<ProfileModal me={me} setMe={setMe} onClose={()=>setModal(null)} onLogout={logout} flash={flash}/>}
    {toast&&<div className="toast" key={toast.id}>{toast.m}</div>}
  </div>;
}
function fmtTime2(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
