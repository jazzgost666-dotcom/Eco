<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eco</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236366F1' d='M15.5 3.2A9 9 0 1 0 20.8 16 7 7 0 0 1 15.5 3.2z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#040406;color:#E6E8EE;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--line2);box-shadow:0 0 0 3px var(--accent-soft)}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em}
.eco{position:relative;display:flex;width:100vw;height:100vh;overflow:hidden;background:var(--bg-canvas);font-size:var(--fs,15px);color:#E6E8EE;--line:rgba(255,255,255,.055);--line2:rgba(255,255,255,.14);--t2:#9AA1B2;--t3:#5E6578}
.eco.hc{--line:rgba(255,255,255,.22);--t2:#D6DAE4;--t3:#A7AEBE}
.eco.rm *{transition:none!important;animation:none!important}
.grow{flex:1;min-width:0}
.muted{color:var(--t3)}
.pad{padding:16px}
.warn{color:#FBBF24;font-size:13px;margin:8px 0}
.danger{color:#F87171!important}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#F43F5E;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--bg-rail,#07080B)}
.badge.sm{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;font-size:9px;border-width:1px}
.rail .badge{position:absolute;top:-3px;right:-3px}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg-sidebar);background:#22C55E}
.dot.away{background:#EAB308}.dot.busy{background:#F43F5E}.dot.invisible,.dot.offline{background:#5E6578}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;overflow:visible}
.av img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.eco.squircle .av{border-radius:30%}
.eco.squircle .av img{border-radius:30%}
.icon-btn{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--t2);position:relative;flex:none}
.icon-btn:hover{background:var(--bg-hover);color:#fff}
.icon-btn.dis{opacity:.4;cursor:not-allowed}
.btn,.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--bg-hover);color:#E6E8EE;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover,.chip-btn:hover{background:var(--line2)}
.btn.primary,.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.danger-ghost{color:#F87171;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.danger-ghost:hover{background:rgba(248,113,113,.12)}
.danger-ghost.wide{width:100%;display:flex;justify-content:center;gap:6px;margin-top:14px}
.pop{position:absolute;z-index:50;background:var(--bg-elev);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6);min-width:200px}
.pop button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;text-align:left;font-size:14px}
.pop button:hover{background:var(--bg-hover)}
.sec-title{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.sec-title button{color:var(--t2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1A1E2A;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.6);animation:fi .2s ease;max-width:90vw;text-align:center}
@keyframes fi{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* rail */
.rail{position:relative;width:68px;flex:none;background:var(--bg-rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px}
.rail-eco{width:44px;height:44px;border-radius:14px;background:var(--bg-hover);display:grid;place-items:center;color:var(--accent);position:relative;transition:.2s;flex:none}
.rail-eco:hover,.rail-eco.on{border-radius:16px;background:var(--accent);color:#fff}
.rail-div{width:28px;height:1px;background:var(--line2);flex:none}
.rail-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;width:100%;align-items:center;flex:1;scrollbar-width:none;padding-top:2px}
.rail-space{position:relative;width:44px;height:44px;border-radius:50%;background:var(--bg-elev);display:grid;place-items:center;font-weight:600;transition:border-radius .2s,background .2s;flex:none}
.rail-space img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.rail-space:hover,.rail-space.on{border-radius:16px;background:var(--accent)}
.rail-space.on::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:28px;border-radius:0 4px 4px 0;background:#fff}
.rail-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:var(--bg-elev);flex:none}
.rail-btn:hover{color:#fff;border-radius:16px;background:var(--bg-hover)}
.rail-foot{margin-top:auto}

/* nav */
.nav{position:relative;width:290px;flex:none;background:var(--bg-sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nav-head{display:flex;align-items:center;gap:8px;padding:16px 14px 10px}
.nav-head h2{margin:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-head small{color:var(--t3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-scroll{flex:1;overflow-y:auto;padding-bottom:8px;min-height:0}
.nav-empty{padding:30px 16px;color:var(--t3)}
.navsearch{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:8px 11px;background:var(--bg-elev);border-radius:10px;border:1px solid var(--line)}
.navsearch input{border:0;padding:0;background:transparent;width:100%}
.navsearch input:focus{box-shadow:none}
.filters{display:flex;gap:6px;padding:0 12px 10px}
.chip{padding:5px 10px;border-radius:999px;font-size:12px;color:var(--t2);background:var(--bg-elev);border:1px solid var(--line)}
.chip.on{background:var(--accent-soft);color:#fff;border-color:var(--accent)}
.conv{display:flex;gap:11px;align-items:center;width:calc(100% - 12px);margin:0 6px;padding:9px 10px;border-radius:12px;text-align:left}
.conv:hover{background:var(--bg-hover)}
.conv.on{background:var(--bg-hover);box-shadow:inset 3px 0 0 var(--accent)}
.conv-body{flex:1;min-width:0}
.conv-top,.conv-bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.conv-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11px;color:var(--t3);flex:none}
.conv-prev{font-size:13px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.typing{color:var(--accent);font-style:normal}
.chan{display:flex;align-items:center;gap:8px;margin:1px 8px;padding:7px 10px;border-radius:9px;color:var(--t2);font-size:14px;cursor:pointer;position:relative}
.chan:hover{background:var(--bg-hover);color:#fff}
.chan.on{background:var(--bg-hover);color:#fff;font-weight:600}
.chan span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan.voice{opacity:.7}
.chan.add{width:calc(100% - 16px);background:none;color:var(--t3);font-size:13px}
.chan-x{opacity:0;color:var(--t3);padding:2px}
.chan:hover .chan-x{opacity:1}
.chan-form{margin:4px 12px}
.chan-form input{width:100%}
.space-menu{top:56px;right:12px}
.userbar{position:relative;display:flex;align-items:center;gap:6px;padding:10px;border-top:1px solid var(--line);background:var(--bg-rail)}
.ub-me{display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-align:left;padding:4px;border-radius:10px}
.ub-me:hover{background:var(--bg-hover)}
.ub-me b{display:block;font-size:13px}
.ub-me small{display:block;color:var(--t3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ub-id{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--t2);padding:4px 6px;border-radius:7px;background:var(--bg-elev);white-space:nowrap}
.ub-id:hover{color:#fff}
.status-pop{bottom:58px;left:10px;width:230px;padding:8px}
.status-pop .dot{position:static;display:inline-block;border:0;margin-right:4px}
.status-pop form{display:flex;gap:6px;margin-top:6px;padding:0 4px 4px}
.status-pop form input{flex:1;padding:7px 9px;font-size:13px}
.status-pop .on{color:#fff;font-weight:600}

/* chat */
.chat{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-canvas);height:100%}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-canvas);min-height:58px;position:relative;z-index:5}
.chat-title{min-width:0;flex:1}
.chat-title b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title small{color:var(--t3);font-size:12px}
.chat-actions{display:flex;align-items:center;gap:2px;position:relative}
.chat-search{display:flex;align-items:center;gap:4px;background:var(--bg-elev);border-radius:10px;padding:3px 4px 3px 10px;border:1px solid var(--line)}
.chat-search input{border:0;background:transparent;padding:4px 0;width:170px}
.chat-search input:focus{box-shadow:none}
.chat-search span{font-size:12px;color:var(--t3);padding:0 4px}
.chat-search button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--t2)}
.chat-search button:hover{background:var(--bg-hover)}
.pin-wrap{position:relative}
.pins{right:0;top:42px;width:300px;max-height:320px;overflow:auto}
.pins .pin-item{display:flex;align-items:center;gap:6px}
.pins .pin-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nav-toggle{display:none}
.feed-wrap{position:relative;flex:1;min-height:0;display:flex}
.wall{position:absolute;inset:0;pointer-events:none;z-index:0}
.feed{position:relative;z-index:1;flex:1;overflow-y:auto;padding:14px 18px 8px;display:flex;flex-direction:column;min-height:0}
.sep{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--t3);font-size:12px;font-weight:600}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.sep span{padding:3px 10px;background:var(--bg-elev);border-radius:999px}
.empty-chat{margin:auto;text-align:center;color:var(--t3);padding:40px}
.empty-chat h3{color:var(--t2);margin:12px 0 4px}
.row{display:flex;gap:10px;align-items:flex-end;padding:1px 0;border-radius:8px;transition:background .6s}
.row.head{margin-top:10px}
.eco.compact .row.head{margin-top:5px}
.row.mine{flex-direction:row-reverse}
.row.flash{background:rgba(99,102,241,.14)}
.av-gap{width:34px;flex:none}
.msg-col{display:flex;flex-direction:column;max-width:min(560px,78%);min-width:0;position:relative}
.row.mine .msg-col{align-items:flex-end}
.msg-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t3);margin:0 4px 3px}
.msg-meta b{color:var(--t2);font-size:13px;font-weight:600}
.msg-meta svg{color:var(--t3)}
.quote{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-left:3px solid var(--accent);background:rgba(255,255,255,.04);border-radius:8px;padding:5px 9px;margin:0 0 3px;max-width:100%;font-size:12px;color:var(--t2)}
.quote b{color:var(--accent);font-size:12px}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bubble{position:relative;background:var(--bg-elev);border-radius:16px;padding:8px 12px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.row.mine .bubble{background:var(--accent);color:#fff}
.eco.bubble-pill .bubble{border-radius:999px;padding:9px 16px}
.eco.bubble-clean .bubble{background:transparent;padding:4px 2px}
.eco.bubble-clean .row.mine .bubble{background:transparent;color:#fff}
.eco.bubble-clean .row.mine .bubble{color:#E6E8EE;}
.eco.bubble-clean .row.mine .txt{color:var(--accent);font-weight:500}
.txt{white-space:pre-wrap}
.edited{font-size:11px;color:var(--t3);margin-left:4px}
.row.mine .edited{color:rgba(255,255,255,.7)}
.ic{background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-family:"JetBrains Mono",monospace;font-size:.88em}
.codeblock{background:#06070A;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;overflow-x:auto;white-space:pre}
.codeblock code{font-size:13px}
.mention{color:#A5B4FC;background:rgba(99,102,241,.14);border-radius:5px;padding:0 4px}
.bubble a{color:#A5B4FC;text-decoration:underline;text-underline-offset:2px}
.media{display:block;max-width:100%;max-height:340px;border-radius:12px;cursor:zoom-in;margin:2px 0;transition:filter .2s}
.media.blurred{filter:blur(18px)}
.gif-ph{width:220px;height:140px;border-radius:12px;background:var(--bg-hover);display:grid;place-items:center;color:var(--t2);font-weight:700;cursor:pointer;letter-spacing:.1em}
.rx-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx{display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 7px;border-radius:999px;background:var(--bg-elev);border:1px solid var(--line);color:var(--t2)}
.rx.on{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.hover-bar{position:absolute;top:-16px;right:0;display:none;align-items:center;gap:2px;background:var(--bg-elev);border:1px solid var(--line2);border-radius:999px;padding:2px 4px;box-shadow:0 8px 20px rgba(0,0,0,.5);z-index:4}
.row.mine .hover-bar{right:auto;left:0}
.msg-col:hover .hover-bar{display:flex}
.hover-bar button{width:28px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:14px;color:var(--t2)}
.hover-bar button:hover{background:var(--bg-hover);color:#fff}
.poll{min-width:240px}
.poll-q{display:block;margin-bottom:8px}
.poll-opt{position:relative;display:flex;justify-content:space-between;width:100%;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.05);margin:4px 0;overflow:hidden;text-align:left;border:1px solid transparent}
.poll-opt.on{border-color:var(--accent)}
.pfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);transition:width .3s}
.ptxt,.poll-opt small{position:relative}
.ptot{color:var(--t3);font-size:12px}
.voice-p{display:flex;align-items:center;gap:8px;min-width:230px;padding:2px 2px}
.vbtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:12px;flex:none}
.row:not(.mine) .vbtn{background:var(--accent);color:#fff}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1;cursor:pointer}
.wave i{display:block;width:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.rate{font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.12)}
.gif-ph{width:200px}

/* composer */
.composer-wrap{position:relative;padding:8px 14px 14px;background:var(--bg-canvas)}
.panel-backdrop{position:fixed;inset:0;z-index:20}
.panel{position:absolute;bottom:calc(100% - 4px);right:14px;width:340px;max-height:360px;background:var(--bg-elev);border:1px solid var(--line2);border-radius:16px;padding:10px;z-index:30;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column}
.panel-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.panel-tabs button{font-size:12px;padding:4px 8px;border-radius:8px;color:var(--t2)}
.panel-tabs button.on{background:var(--accent-soft);color:#fff}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;overflow-y:auto}
.emoji-grid button{font-size:22px;height:36px;border-radius:8px}
.emoji-grid button:hover{background:var(--bg-hover)}
.gif-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto}
.gif-grid .g{position:relative;border-radius:10px;overflow:hidden;background:var(--bg-hover);aspect-ratio:4/3}
.gif-grid .g img{width:100%;height:100%;object-fit:cover;display:block}
.gif-grid .g .gx{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.banner-c{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;background:var(--bg-elev);border-radius:12px;border-left:3px solid var(--accent);font-size:13px;color:var(--t2)}
.banner-c span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner-c.edit{border-left-color:#FBBF24}
.pending{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:6px;background:var(--bg-elev);border-radius:12px;font-size:13px;color:var(--t2)}
.pending img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.pending span{flex:1}
.comp-row{display:flex;align-items:flex-end;gap:6px;background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;padding:6px}
.ta-wrap{flex:1;min-width:0}
.ta-wrap textarea{width:100%;border:0;background:transparent;resize:none;padding:8px 6px;max-height:160px;line-height:1.45;min-height:38px}
.ta-wrap textarea:focus{box-shadow:none}
.gif-t{font-size:11px;font-weight:800;border:1.5px solid currentColor;border-radius:5px;padding:0 3px;letter-spacing:.02em}
.send{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{filter:brightness(1.1)}
.mic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:#fff;display:grid;place-items:center;flex:none}
.rec-bar{display:flex;align-items:center;gap:10px;background:var(--bg-elev);border:1px solid #F43F5E55;border-radius:16px;padding:8px 10px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#F43F5E;animation:pulse 1s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
.rec-bar b{font-variant-numeric:tabular-nums;min-width:40px}
.rec-bar small{color:var(--t3);flex:1}
.meter{position:relative;height:6px;background:var(--bg-hover);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),#22D3EE);transition:width .1s;border-radius:4px}
.plus-menu{left:14px;bottom:70px;width:220px}
.comp-plus{position:relative}

/* toast + modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:16px;animation:fi .18s ease}
.modal{width:min(480px,100%);max-height:88vh;background:var(--bg-sidebar);border:1px solid var(--line2);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal.wide{width:min(900px,100%);height:min(680px,88vh)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--t2)}
.field input,.field textarea{width:100%}
.field textarea{resize:vertical;min-height:70px}
.list{display:flex;flex-direction:column;gap:4px}
.row-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.02)}
.row-item small{display:block;color:var(--t3);font-size:12px}

/* ================= UTILITÁRIOS ================= */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const genId=()=>'ECO#'+String(1000+Math.floor(Math.random()*8999));
const genCode=()=>'ECO-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const fmtSec=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtTime=(ts,h12)=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:h12});
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const dayLabel=ts=>{const y=new Date();y.setDate(y.getDate()-1);if(sameDay(ts,Date.now()))return'Hoje';if(sameDay(ts,y))return'Ontem';return new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})};
const timeShort=ts=>sameDay(ts,Date.now())?fmtTime(ts,false):new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
function resizeImage(dataUrl,max,q){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};
    im.onerror=()=>res(dataUrl);
    im.src=dataUrl;
  });
}
function copyText(t,toast){
  const done=()=>toast('Copiado!');

}
function previewText(m){
  if(!m)return'';

/* ---- Sons (Web Audio API) ---- */
let AC=null;
function playTone(seq){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.05,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);t+=d*0.9;
    });
  }catch(e){}
}
/* ---- WAV fallback (tom sintetizado) quando o microfone não está disponível ---- */
function toneWavDataUrl(seconds){
  const sr=8000,n=Math.floor(sr*seconds);
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const env=Math.min(1,i/800,(n-i)/800);const s=Math.sin(2*Math.PI*440*i/sr)*0.25*env;v.setInt16(44+i*2,Math.round(s*32767),true)}
  const bytes=new Uint8Array(buf);let bin='';
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return'data:audio/wav;base64,'+btoa(bin);
}

/* ---- Persistência (localStorage + tratamento de cota) ---- */
function loadDb(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&d.v===1){
        const base=seedDb();
        return{...base,...d,me:{...base.me,...d.me},settings:{...defaultSettings(),...d.settings,sounds:{...defaultSettings().sounds,...((d.settings||{}).sounds||{})}}};
      }
    }
  }catch(e){}
  return seedDb();
}
function saveDb(db){
  const tryWrite=d=>{try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){return false}};
  if(tryWrite(db))return{db};
  const copy=structuredClone(db);
  copy.savedGifs=[];
  if(tryWrite(copy))return{db:copy,msg:'Armazenamento cheio: GIFs salvos foram removidos.'};
  const media=[];
  Object.values(copy.msgs).forEach(list=>list.forEach(m=>{if(m.media)media.push(m)}));
  media.sort((a,b)=>a.ts-b.ts);
  let pool=media.slice();
  while(pool.length){
    const n=Math.ceil(pool.length/2);
    pool.slice(0,n).forEach(m=>{m.media=null;m.type='text';m.text=m.text||m.caption||'[mídia antiga removida]';m.caption=''});
    pool=pool.slice(n);
    if(tryWrite(copy))return{db:copy,msg:'Armazenamento cheio: mídias antigas foram removidas automaticamente.'};
  }
  return{db,msg:'Armazenamento local cheio. Libere espaço em Configurações → Dados.'};
}

/* ================= MARKDOWN SEGURO (sem innerHTML) ================= */
const INLINE_RE=/(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(~~[^~\n]+~~)|(\*[^*\n]+\*)|(https?:\/\/[^\s<]+)|(ECO#\d{4})/g;
function renderInline(text){
  const out=[];let last=0,m,i=0;
  INLINE_RE.lastIndex=0;
  while((m=INLINE_RE.exec(text))){
    if(m.index>last)out.push(text.slice(last,m.index));
    const s=m[0],k='i'+(i++);
    if(m[1])out.push(<code key={k} className="ic">{s.slice(1,-1)}</code>);
    else if(m[2])out.push(<strong key={k}>{s.slice(2,-2)}</strong>);
    else if(m[3])out.push(<s key={k}>{s.slice(2,-2)}</s>);
    else if(m[4])out.push(<em key={k}>{s.slice(1,-1)}</em>);
    else if(m[5])out.push(<a key={k} href={s} target="_blank" rel="noopener noreferrer nofollow">{s}</a>);
    else out.push(<span key={k} className="mention">{s}</span>);
    last=INLINE_RE.lastIndex;
  }
  if(last<text.length)out.push(text.slice(last));
  return out;
}
function Markdown({text}){
  const parts=String(text||'').split(/```([\s\S]*?)```/g);
  return <>{parts.map((p,i)=> i%2===1
    ? <pre key={i} className="codeblock"><code>{p.replace(/^\w*\n/,'')}</code></pre>
    : <Fragment key={i}>{renderInline(p)}</Fragment>)}</>;
}

function VoicePlayer({src,duration}){
  const a=useRef(null);
  const [playing,setPlaying]=useState(false);
  const [cur,setCur]=useState(0);
  const [dur,setDur]=useState(duration||0);
  const [rate,setRate]=useState(1);
  const bars=useMemo(()=>{const seed=(String(src||'').length)%7;return Array.from({length:32},(_,i)=>6+Math.abs(Math.sin(i*1.7+seed))*18)},[src]);
  useEffect(()=>{if(a.current)a.current.playbackRate=rate},[rate]);
  const frac=dur?Math.min(1,cur/dur):0;
  return <div className="voice-p">
    <button className="vbtn" aria-label={playing?'Pausar':'Tocar'} onClick={()=>{const el=a.current;if(!el)return;if(el.paused)el.play().catch(()=>{});else el.pause()}}>{playing?'❚❚':'▶'}</button>
    <div className="wave" onClick={e=>{const r=e.currentTarget.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));if(a.current&&dur)a.current.currentTime=p*dur}}>
      {bars.map((h,i)=><i key={i} style={{height:h,background:(i/bars.length)<=frac?'var(--accent)':'rgba(255,255,255,.28)'}}/>)}
    </div>
    <span className="vtime">{fmtSec(playing||cur?cur:dur)}</span>
    <button className="rate" onClick={()=>setRate(r=>r===1?1.5:r===1.5?2:1)} title="Velocidade">{rate}x</button>
    <audio ref={a} src={src} preload="metadata"
      onPlay={()=>setPlaying(true)} onPause={()=>setPlaying(false)} onEnded={()=>{setPlaying(false);setCur(0)}}
      onTimeUpdate={e=>setCur(e.currentTarget.currentTime)}
      onLoadedMetadata={e=>{if(isFinite(e.currentTarget.duration)&&e.currentTarget.duration>0)setDur(e.currentTarget.duration)}}/>
  </div>;
}
function PollBody({m}){
  const {vote}=useEco();
  const total=m.poll.options.reduce((a,o)=>a+o.votes.length,0);

}

function Feed(){
  const {msgs,S,ui,isDM,chatTitle}=useEco();
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight},[msgs.length,ui.chat]);
  const byId=useMemo(()=>Object.fromEntries(msgs.map(m=>[m.id,m])),[msgs]);
  const items=[];let lastDay=null,prev=null;
  msgs.forEach(m=>{
    if(!lastDay||!sameDay(m.ts,lastDay)){items.push({sep:true,key:'d'+m.id,label:dayLabel(m.ts)});lastDay=m.ts;prev=null}
    const head=!prev||prev.from!==m.from||m.ts-prev.ts>5*60000;
    items.push({m,head,key:m.id});prev=m;
  });
  const wallStyle=(()=>{
    if(S.wallpaper==='grid')return{backgroundImage:'linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px)',backgroundSize:'28px 28px'};
    if(S.wallpaper==='dots')return{backgroundImage:'radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px)',backgroundSize:'18px 18px'};
    if(S.wallpaper==='img'&&S.wallImg)return{backgroundImage:`url(${S.wallImg})`,backgroundSize:'cover',backgroundPosition:'center',opacity:S.wallOpacity,inset:S.wallBlur?'-14px':'0',filter:S.wallBlur?`blur(${S.wallBlur}px)`:undefined};
    return{};
  })();
  return <div className="feed-wrap">
    <div className="wall" style={wallStyle}/>
    <div className="feed" ref={ref} role="log" aria-label={'Mensagens de '+chatTitle}>
      {items.length===0&&<div className="empty-chat">
        <div style={{color:'var(--accent)',display:'flex',justifyContent:'center'}}><BrandMoon size={44}/></div>
        <h3>{isDM?'Comece a conversa':'Nenhuma mensagem neste canal'}</h3>
        <p>Envie texto, foto, GIF ou um áudio gravado no próprio chat.</p>
      </div>}
      {items.map(it=>it.sep

  </div>;
}

/* ---- Compositor ---- */
function Composer(){
  const {S,ui,setUi,mutate,showToast,sendPayload,editing,setEditing,replying,setReplying,msgs,panel,setPanel,pending,setPending,saveEdit,nameOf,chatTitle,handleFile}=useEco();
  const [draft,setDraft]=useState('');
  const [plusOpen,setPlusOpen]=useState(false);
  const [rec,setRec]=useState(null);
  const taRef=useRef(null);
  const fileRef=useRef(null);
  const recRef=useRef({active:false});

  useEffect(()=>{setDraft('');setPlusOpen(false)},[ui.chat]);
  useEffect(()=>{if(editing){setDraft(editing.text||'');setTimeout(()=>taRef.current&&taRef.current.focus(),0)}},[editing]);
  useEffect(()=>{if(replying&&taRef.current)taRef.current.focus()},[replying]);
  useEffect(()=>()=>{const rc=recRef.current;if(rc.active){rc.active=false;clearInterval(rc.timer);rc.stream&&rc.stream.getTracks().forEach(t=>t.stop())}},[]);

  const submit=()=>{
    const text=draft.trim();
    if(pending){
      sendPayload({type:pending.type,media:pending.data,caption:text});
      setPending(null);setDraft('');return;
    }
    if(!text)return;
    if(editing){saveEdit(editing.id,text);setDraft('');return}
    sendPayload({text});setDraft('');
  };
  const insertEmoji=e=>{
    setDraft(d=>d+e);
    mutate(d=>{d.recentEmoji=[e,...(d.recentEmoji||[]).filter(x=>x!==e)].slice(0,16)});
  };
  const cancelEdit=()=>{setEditing(null);setDraft('')};
  const onKey=e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();return}
    if(e.key==='ArrowUp'&&!draft&&!pending&&!editing){
      const mine=[...msgs].reverse().find(m=>m.from==='me'&&m.type==='text');
      if(mine){e.preventDefault();setEditing(mine)}
      return;
    }
    if(e.key==='Escape'){if(editing)cancelEdit();if(replying)setReplying(null)}
  };
  const onPaste=e=>{
    const items=[...((e.clipboardData&&e.clipboardData.items)||[])];
    const img=items.find(i=>i.type.startsWith('image/'));
    if(img){e.preventDefault();const f=img.getAsFile();if(f)handleFile(f)}
  };

  /* ---- Gravação de voz (MediaRecorder + medidor + fallback WAV) ---- */
  const startRec=async()=>{
    if(recRef.current.active)return;
    const rc={active:true,chunks:[],startedAt:Date.now(),stream:null,mr:null,an:null,ac:null,buf:null,timer:null};
    recRef.current=rc;
    try{rc.stream=await navigator.mediaDevices.getUserMedia({audio:S.micId?{deviceId:{exact:S.micId}}:true})}catch(e){rc.stream=null}
    if(!rc.active){rc.stream&&rc.stream.getTracks().forEach(t=>t.stop());return}
    if(rc.stream){
      try{
        const AudioC=window.AudioContext||window.webkitAudioContext;
        rc.ac=new AudioC();
        const an=rc.ac.createAnalyser();an.fftSize=256;
        rc.ac.createMediaStreamSource(rc.stream).connect(an);
        rc.an=an;rc.buf=new Uint8Array(an.fftSize);
      }catch(e){}
      try{rc.mr=new MediaRecorder(rc.stream,{audioBitsPerSecond:S.voiceQuality==='high'?128000:32000})}
      catch(e){try{rc.mr=new MediaRecorder(rc.stream)}catch(e2){rc.mr=null}}
      if(rc.mr){rc.mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)rc.chunks.push(ev.data)};rc.mr.start(250)}
    }
    setRec({elapsed:0,level:0,fallback:!(rc.stream&&rc.mr)});
    rc.timer=setInterval(()=>{
      let lvl=0;
      if(rc.an){rc.an.getByteTimeDomainData(rc.buf);let s=0;for(const v of rc.buf){const x=(v-128)/128;s+=x*x};lvl=Math.min(1,Math.sqrt(s/rc.buf.length)*5)}
      setRec(r=>r?{...r,elapsed:(Date.now()-rc.startedAt)/1000,level:lvl}:r);
    },100);
  };
  const stopRec=send=>{
    const rc=recRef.current;
    if(!rc.active)return;
    rc.active=false;clearInterval(rc.timer);
    const dur=Math.max(1,Math.round((Date.now()-rc.startedAt)/1000));
    const cleanup=()=>{rc.stream&&rc.stream.getTracks().forEach(t=>t.stop());try{rc.ac&&rc.ac.close()}catch(e){}setRec(null)};
    if(rc.mr&&rc.mr.state!=='inactive'){
      rc.mr.onstop=async()=>{
        try{
          if(send&&rc.chunks.length){
            const blob=new Blob(rc.chunks,{type:rc.mr.mimeType||'audio/webm'});
            const data=await readFile(blob);
            sendPayload({type:'audio',media:data,duration:dur});
          }
        }catch(e){showToast('Não foi possível salvar o áudio')}
        cleanup();
      };
      rc.mr.stop();
    }else{
      if(send){
        const d=Math.min(dur,20);
        sendPayload({type:'audio',media:toneWavDataUrl(d),duration:d,text:'(áudio sintetizado — microfone indisponível)'});
      }
      cleanup();
    }
  };

  const hasContent=draft.trim()||pending;
  return <div className="composer-wrap">
    {panel&&<div className="panel-backdrop" onMouseDown={()=>setPanel(null)}/>}
    {panel==='emoji'&&<EmojiPanel onPick={insertEmoji}/>}
    {panel==='gif'&&<GifPanel onSend={src=>{sendPayload({type:'gif',media:src});setPanel(null)}}/>}
    {replying&&<div className="banner-c">
      <Icon n="reply" size={15}/><span>Respondendo a <b style={{color:'var(--t)'}}>{replying.from==='me'?'você':nameOf(replying.from)}</b>: {previewText(replying)}</span>
      <button className="icon-btn" onClick={()=>setReplying(null)} aria-label="Cancelar resposta"><Icon n="x" size={14}/></button>
    </div>}
    {editing&&<div className="banner-c edit">
      <Icon n="edit" size={15}/><span>Editando mensagem</span>
      <button className="btn" onClick={cancelEdit}>Cancelar</button>
    </div>}
    {pending&&<div className="pending">
      <img src={pending.data} alt="Pré-visualização"/>
      <span>{pending.type==='gif'?'GIF pronto para enviar.':'Foto pronta para enviar.'} Escreva uma legenda se quiser e pressione Enter.</span>
      <button className="btn" onClick={()=>setPending(null)}>Remover</button>
    </div>}
    {plusOpen&&<div className="pop plus-menu" onMouseDown={e=>e.stopPropagation()}>
      <button onClick={()=>{setPlusOpen(false);fileRef.current&&fileRef.current.click()}}><Icon n="image" size={15}/> Foto do PC</button>
      <button onClick={()=>{setPlusOpen(false);setUi(u=>({...u,modal:'poll'}))}}><Icon n="poll" size={15}/> Enquete</button>
    </div>}
    {rec?<div className="rec-bar">
      <span className="rec-dot"/>
      <b>{fmtSec(rec.elapsed)}</b>
      <div className="meter"><i style={{width:(rec.level*100)+'%'}}/></div>
      {rec.fallback&&<small>Microfone indisponível: áudio sintetizado</small>}
      <button className="icon-btn" title="Cancelar gravação" aria-label="Cancelar gravação" onClick={()=>stopRec(false)}><Icon n="trash" size={17}/></button>
      <button className="send" title="Enviar áudio" aria-label="Enviar áudio" onClick={()=>stopRec(true)}><Icon n="send" size={18}/></button>
    </div>
    :<div className="comp-row">
      <button className="icon-btn" aria-label="Anexar" title="Anexar ou enquete" onClick={()=>setPlusOpen(o=>!o)}><Icon n="plus" size={20}/></button>
      <div className="ta-wrap">
        <textarea ref={taRef} rows={1} value={draft} placeholder={`Mensagem para ${chatTitle}`}
          onChange={e=>setDraft(e.target.value)} onKeyDown={onKey} onPaste={onPaste} aria-label="Escrever mensagem"/>
      </div>
      <button className="icon-btn" title="GIFs" aria-label="GIFs" onClick={()=>setPanel(panel==='gif'?null:'gif')}><b className="gif-t">GIF</b></button>
      <button className="icon-btn" title="Emojis" aria-label="Emojis" onClick={()=>setPanel(panel==='emoji'?null:'emoji')}><Icon n="smile" size={19}/></button>
      {hasContent
        ? <button className="send" title="Enviar (Enter)" aria-label="Enviar" onClick={submit}><Icon n="send" size={18}/></button>
        : <button className="mic" title="Gravar mensagem de voz" aria-label="Gravar voz" onClick={startRec}><Icon n="mic" size={18}/></button>}
    </div>}
    <input ref={fileRef} type="file" accept="image/*" hidden onChange={e=>{handleFile(e.target.files[0]);e.target.value=''}}/>
  </div>;
}

function MicTest({deviceId}){
  const [on,setOn]=useState(false);
  const [lvl,setLvl]=useState(0);
  const [err,setErr]=useState('');
  useEffect(()=>{
    if(!on)return;
    let raf=0,stream=null,ac=null,dead=false;
    (async()=>{
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:deviceId?{deviceId:{exact:deviceId}}:true});
        if(dead){stream.getTracks().forEach(t=>t.stop());return}
        const AudioC=window.AudioContext||window.webkitAudioContext;
        ac=new AudioC();
        const an=ac.createAnalyser();an.fftSize=256;
        ac.createMediaStreamSource(stream).connect(an);
        const buf=new Uint8Array(an.fftSize);
        const loop=()=>{an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x};setLvl(Math.min(1,Math.sqrt(s/buf.length)*5));raf=requestAnimationFrame(loop)};
        loop();
      }catch(e){setErr('Microfone indisponível ou permissão negada.');setOn(false)}
    })();
    return()=>{dead=true;cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());try{ac&&ac.close()}catch(e){}setLvl(0)};
  },[on,deviceId]);
  return <div className="mictest">
    <button className="btn" onClick={()=>{setErr('');setOn(o=>!o)}}>{on?'Parar teste':'Testar microfone'}</button>
    <div className="meter"><i style={{width:(lvl*100)+'%'}}/></div>
    {on&&lvl<0.02&&!err&&<small className="muted">Fale algo para ver o nível…</small>}
    {err&&<small className="warn" style={{margin:0}}>{err}</small>}
  </div>;
}

          <h4>Conversas</h4>
          <SRow q={q} label="Estilo dos balões" hint="Como as mensagens são desenhadas">
            <Select value={S.bubble} onChange={v=>set('bubble',v)} options={[['rounded','Arredondado'],['pill','Pílula'],['clean','Limpo / sem fundo']]}/>
          </SRow>
          <SRow q={q} label="Papel de parede" hint="Fundo do chat">
            <Select value={S.wallpaper} onChange={v=>set('wallpaper',v)} options={[['none','Sólido'],['grid','Grade noturna'],['dots','Pontos discretos'],['img','Imagem do PC']]}/>
          </SRow>
          {(S.wallpaper==='img'||showAll)&&<SRow q={q} label="Imagem do papel de parede" hint="Envie uma foto do seu computador">
            <div style={{display:'flex',gap:6}}>
              <label className="lbl-btn">Enviar<input type="file" accept="image/*" hidden onChange={e=>{pickWall(e.target.files[0]);e.target.value=''}}/></label>
              {S.wallImg&&<button className="danger-ghost" onClick={()=>mutate(d=>{d.settings.wallImg=null;d.settings.wallpaper='none'})}>Remover</button>}
            </div>
          </SRow>}
          {(S.wallpaper==='img'||showAll)&&<SRow q={q} label="Opacidade da imagem"><input type="range" min={0.05} max={0.8} step={0.05} value={S.wallOpacity} onChange={e=>set('wallOpacity',Number(e.target.value))}/></SRow>}
          {(S.wallpaper==='img'||showAll)&&<SRow q={q} label="Desfoque da imagem"><input type="range" min={0} max={12} step={1} value={S.wallBlur} onChange={e=>set('wallBlur',Number(e.target.value))}/></SRow>}
          <SRow q={q} label="Densidade" hint="Espaçamento das mensagens">
            <Select value={S.density} onChange={v=>set('density',v)} options={[['comfortable','Confortável'],['compact','Compacto']]}/>
          </SRow>
          <SRow q={q} label={`Tamanho da fonte (${S.fontSize}px)`}><input type="range" min={13} max={18} step={1} value={S.fontSize} onChange={e=>set('fontSize',Number(e.target.value))}/></SRow>
          <SRow q={q} label="Formato dos avatares"><Select value={S.avatarShape} onChange={v=>set('avatarShape',v)} options={[['circle','Círculo'],['squircle','Squircle']]}/></SRow>
          <h4>Acessibilidade</h4>
          <SRow q={q} label="Reduzir animações"><Toggle on={S.reduceMotion} onChange={v=>set('reduceMotion',v)}/></SRow>
          <SRow q={q} label="Alto contraste"><Toggle on={S.highContrast} onChange={v=>set('highContrast',v)}/></SRow>
        </Fragment>}

        {on('voz')&&<Fragment>
          <h4>Microfone</h4>
          <SRow q={q} label="Dispositivo de entrada" hint="Escolha o microfone usado nas mensagens de voz">
            <Select value={S.micId} onChange={v=>set('micId',v)} options={[['','Padrão do sistema'],...devs.map(d=>[d.deviceId,d.label||'Microfone '+(devs.indexOf(d)+1)])]}/>
          </SRow>
          <SRow q={q} label="Testar microfone" hint="Mostra o nível de entrada em tempo real"><MicTest deviceId={S.micId}/></SRow>
          <h4>Mensagens de voz</h4>
          <SRow q={q} label="Qualidade da gravação" hint="Alta usa mais espaço"><Select value={S.voiceQuality} onChange={v=>set('voiceQuality',v)} options={[['standard','Padrão'],['high','Alta']]}/></SRow>
          <h4>Mídia</h4>
          <SRow q={q} label="Reprodução de GIFs" hint="Sempre ativa ou só ao passar o mouse"><Select value={S.gifAutoplay} onChange={v=>set('gifAutoplay',v)} options={[['always','Sempre'],['hover','Apenas no hover']]}/></SRow>
          <SRow q={q} label="Compressão de imagens" hint="Otimizada reduz fotos grandes para economizar espaço"><Select value={S.imageCompress} onChange={v=>set('imageCompress',v)} options={[['original','Original'],['optimized','Otimizada']]}/></SRow>
        </Fragment>}

        {on('notif')&&<Fragment>
          <h4>Sons de interface</h4>
          <SRow q={q} label="Sons ativados" hint="Desative para silenciar todos os sons"><Toggle on={S.soundsOn} onChange={v=>set('soundsOn',v)}/></SRow>
          {[['sent','Mensagem enviada'],['received','Mensagem recebida'],['notif','Notificação']].map(([k,l])=>
            <SRow key={k} q={q} label={l}>
              <button className="btn" onClick={()=>playTone(SOUND_SEQ[k])}>Ouvir</button>
              <Toggle on={S.sounds[k]} onChange={v=>setSound(k,v)}/>
            </SRow>)}
          <h4>Notificações</h4>
          <SRow q={q} label="Não perturbe" hint="Silencia sons e notificações do navegador"><Toggle on={S.dnd} onChange={v=>set('dnd',v)}/></SRow>
          <SRow q={q} label="Notificações da área de trabalho" hint="Pede permissão ao navegador">
            <Toggle on={S.desktopNotif} onChange={v=>{
              if(v&&'Notification' in window&&Notification.permission!=='granted'){Notification.requestPermission().then(p=>{if(p==='granted')set('desktopNotif',true);else showToast('Permissão de notificações negada')})}
              else set('desktopNotif',v);
            }}/>
          </SRow>
          <h4>Idioma e formato</h4>
          <SRow q={q} label="Idioma" hint="A interface está em português (Brasil) nesta versão"><Select value={S.lang} onChange={v=>set('lang',v)} options={[['pt-BR','Português (BR)']]}/></SRow>
          <SRow q={q} label="Formato de hora"><Select value={S.hourFmt} onChange={v=>set('hourFmt',v)} options={[['24','24h'],['12','12h AM/PM']]}/></SRow>
        </Fragment>}

        {on('dados')&&<Fragment>
          <h4>Armazenamento local</h4>
          <div style={{padding:'8px 0'}}>
            <div className="muted" style={{fontSize:13}}>Uso estimado: <b style={{color:'var(--t)'}}>{kb.toFixed(0)} KB</b> de cerca de 5.000 KB do navegador</div>
            <div className="stor"><i style={{width:Math.min(100,kb/5000*100)+'%'}}/></div>
          </div>
          <SRow q={q} label="Limpar mídias antigas" hint="Remove fotos, GIFs e áudios com mais de 30 dias"><button className="btn" onClick={clearOld}>Limpar</button></SRow>
          <SRow q={q} label="Restaurar padrões de fábrica" hint="Apaga mensagens, contatos e configurações salvos"><button className="btn" style={{color:'#F87171'}} onClick={()=>{if(confirm('Restaurar tudo ao padrão? Isso apaga suas mensagens e configurações.'))resetAll()}}>Restaurar</button></SRow>
        </Fragment>}

        {showAll&&<p className="muted" style={{marginTop:16,fontSize:12}}>Mostrando todas as opções com o termo "{q}". Limpe a busca para voltar às abas.</p>}
      </div>
    </div>
  </Modal>;
}

/* ================= COLUNA 4: PAINEL DIREITO ================= */
function RightPanel(){
  const {db,isDM,contact,space,msgs,people,mutate,showToast,goChat,setLightbox,blockContact,setUi}=useEco();
  const [filter,setFilter]=useState('');
  if(isDM){
    const shared=db.spaces.filter(s=>s.members.includes(contact.id));
    const media=msgs.filter(m=>m.media&&(m.type==='image'||m.type==='gif')).slice(-6).reverse();
    return <aside className="right" aria-label="Detalhes do contato">
      <div className="rp-banner" style={{background:GRADIENTS[hue(contact.id)%GRADIENTS.length]}}/>
      <div className="rp-body">
        <Avatar p={contact} size={76} status={contact.status}/>
        <h3>{contact.alias||contact.name}</h3>
        <div className="muted" style={{fontSize:13}}>@{contact.username}</div>
        <button className="id-chip" onClick={()=>copyText(contact.id,showToast)} title="Copiar ID">{contact.id} <Icon n="copy" size={12}/></button>
        <p>{contact.bio||'Sem biografia.'}</p>
        <div className="sec-title" style={{padding:'10px 0 4px'}}>Apelido local</div>
        <input maxLength={32} value={contact.alias||''} placeholder={contact.name} onChange={e=>mutate(d=>{const c=d.contacts.find(x=>x.id===contact.id);if(c)c.alias=e.target.value})}/>
        <div className="sec-title" style={{padding:'10px 0 4px'}}>Grupos em comum</div>
        {shared.length===0&&<span className="muted" style={{fontSize:13}}>Nenhum.</span>}
        {shared.map(s=><button key={s.id} className="member" onClick={()=>goChat(`ch:${s.id}:${s.channels[0].id}`)}><span className="av" style={{width:26,height:26,background:'var(--bg-hover)',fontSize:13}}>{s.icon}</span><b>{s.name}</b></button>)}
        <div className="sec-title" style={{padding:'10px 0 4px'}}>Mídia recente</div>
        {media.length===0&&<span className="muted" style={{fontSize:13}}>Nenhuma foto ainda.</span>}
        <div className="mini-gal">{media.map(m=><button key={m.id} onClick={()=>setLightbox({src:m.media,name:'eco-'+m.id+'.jpg'})}><img src={m.media} alt=""/></button>)}</div>
        <button className="danger-ghost wide" onClick={()=>{if(confirm(`Bloquear ${contact.name}?`)){blockContact(contact.id);showToast(contact.name+' bloqueado')}}}><Icon n="ban" size={15}/> Bloquear</button>
      </div>
    </aside>;
  }
  if(!space)return null;
  const all=['me',...space.members.filter(x=>x!=='me')];
  const list=all.filter(id=>{if(!filter.trim())return true;const p=id==='me'?db.me:people(id);return (p.name||'').toLowerCase().includes(filter.trim().toLowerCase())});
  return <aside className="right" aria-label="Membros do Eco">
    <div className="rp-body" style={{marginTop:0,padding:'16px'}}>
      <div className="sec-title" style={{padding:'0 0 6px'}}><span>Membros · {all.length}</span></div>
      <input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Buscar membro" aria-label="Buscar membro"/>
      <p className="muted" style={{fontSize:12,margin:'8px 0 4px'}}>Todos os membros têm os mesmos direitos.</p>
      <div className="list" style={{marginTop:6}}>
        {list.map(id=>{
          const p=id==='me'?db.me:people(id);
          const isContact=id!=='me'&&db.contacts.some(c=>c.id===id);
          return <button key={id} className="member" onClick={()=>{
            if(id==='me')return;
            if(isContact)goChat('dm:'+id);
            else showToast('Adicione este membro por ID para conversar.');
          }}>
            <Avatar p={p} size={32} status={p.status}/>
            <div style={{minWidth:0}}><b>{id==='me'?'Você':p.name}</b><small>{id==='me'?db.me.id:(STATUS_LABEL[p.status]||'') + (isContact?'':' · não é contato')}</small></div>
          </button>;
        })}
      </div>
    </div>
  </aside>;
}

/* ================= ÁREA DE CHAT ================= */
function ChatArea(){
  const {valid,handleFile,ui}=useEco();
  if(!valid)return <main className="chat"><div className="empty-chat"><h3>Nada selecionado</h3><p>Escolha uma conversa ou um Eco.</p></div></main>;
  return <main className="chat" onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(f)}}>
    <ChatHeader/>
    <Feed/>
    <Composer/>
  </main>;
}

/* ================= APP (estado global) ================= */
function App(){
  const [db,setDb]=useState(loadDb);
  const [ui,setUi]=useState({chat:'dm:ECO#1001',rightOpen:true,modal:null,settingsTab:'perfil',navQuery:'',navFilter:'todas',navOpen:false,spaceMode:'create',spaceId:null});
  const [typing,setTyping]=useState({});
  const [toast,setToast]=useState(null);
  const [menu,setMenu]=useState(null);
  const [editing,setEditing]=useState(null);
  const [replying,setReplying]=useState(null);
  const [flash,setFlash]=useState(null);
  const [lightbox,setLightbox]=useState(null);
  const [pinOpen,setPinOpen]=useState(false);
  const [panel,setPanel]=useState(null);
  const [pending,setPending]=useState(null);
  const chatRef=useRef(ui.chat);
  chatRef.current=ui.chat;
  const S=db.settings;
  const T=DARK_THEMES[S.theme]||DARK_THEMES.obsidian;

  const showToast=useCallback(msg=>setToast({msg,id:uid()}),[]);
  const mutate=useCallback(fn=>setDb(prev=>{const d=structuredClone(prev);fn(d);return d}),[]);
  const sfx=kind=>{if(!S.soundsOn||S.dnd||!S.sounds[kind])return;playTone(SOUND_SEQ[kind])};
  const closeModal=useCallback(()=>setUi(u=>({...u,modal:null})),[]);
  const goChat=useCallback(key=>setUi(u=>({...u,chat:key,modal:null,navOpen:false})),[]);

  const people=id=>{
    if(id==='me')return db.me;
    return db.contacts.find(c=>c.id===id)||PROFILES.find(p=>p.id===id)||{id,name:'Usuário '+id,username:'',status:'offline',bio:''};
  };
  const nameOf=id=>{const p=people(id);return p.alias||p.name};

  const parts=ui.chat.split(':');
  const isDM=parts[0]==='dm';
  const contact=isDM?(db.contacts.find(c=>c.id===parts[1])||null):null;
  const space=!isDM?(db.spaces.find(s=>s.id===parts[1])||null):null;
  const channel=space?(space.channels.find(c=>c.id===parts[2])||null):null;
  const valid=isDM?!!contact:!!channel;
  const msgs=valid?(db.msgs[ui.chat]||[]):[];
  const chatTitle=!valid?'':isDM?(contact.alias||contact.name):'#'+channel.name;

  /* ---- efeitos ---- */
  useEffect(()=>{
    if(!toast)return;
    const t=setTimeout(()=>setToast(null),2400);
    return()=>clearTimeout(t);
  },[toast]);
  useEffect(()=>{
    const id=setTimeout(()=>{
      const r=saveDb(db);
      if(r.db!==db)setDb(r.db);
      if(r.msg)showToast(r.msg);
    },250);
    return()=>clearTimeout(id);
  },[db]);
  useEffect(()=>{
    if(valid)return;
    const c=db.contacts[0];const sp=db.spaces[0];
    setUi(u=>({...u,chat:c?'dm:'+c.id:sp?`ch:${sp.id}:${sp.channels[0].id}`:u.chat}));
  },[valid,db.contacts.length,db.spaces.length]);
  useEffect(()=>{
    setEditing(null);setReplying(null);setMenu(null);setFlash(null);setPanel(null);setPending(null);
  },[ui.chat]);
  const unreadNow=db.unread[ui.chat];
  useEffect(()=>{if(unreadNow)mutate(d=>{d.unread[ui.chat]=0})},[ui.chat,unreadNow]);
  useEffect(()=>{
    const onKey=e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setUi(u=>({...u,modal:'quick'}));return}
      if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();setUi(u=>({...u,modal:'settings'}));return}
      if(e.key==='Escape'){setMenu(null);setLightbox(null);setPinOpen(false);setPanel(null);setUi(u=>u.modal?{...u,modal:null}:u)}
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[]);

  /* ---- respostas simuladas nos contatos ---- */
  const scheduleReply=(cid,key)=>{
    setTyping(t=>({...t,[cid]:true}));
    setTimeout(()=>{
      setTyping(t=>({...t,[cid]:false}));
      const text=REPLIES[Math.floor(Math.random()*REPLIES.length)];
      const active=chatRef.current===key;
      mutate(d=>{
        if(!d.contacts.some(c=>c.id===cid))return;
        (d.msgs[key]=d.msgs[key]||[]).push({id:uid(),from:cid,ts:Date.now(),type:'text',text,media:null,caption:'',duration:0,poll:null,replyTo:null,reactions:{},pinned:false,edited:false});
        if(!active)d.unread[key]=(d.unread[key]||0)+1;
      });
      if(!active){
        sfx('notif');
        if(!S.dnd&&S.desktopNotif&&'Notification' in window&&Notification.permission==='granted'&&document.hidden){
          try{new Notification(people(cid).name,{body:text})}catch(e){}
        }
      }else sfx('received');
    },1000+Math.random()*600);
  };

  /* ---- ações de mensagem ---- */
  const sendPayload=p=>{
    const key=ui.chat;
    const msg={id:uid(),from:'me',ts:Date.now(),type:p.type||'text',text:p.text||'',media:p.media||null,caption:p.caption||'',duration:p.duration||0,poll:p.poll||null,replyTo:replying?replying.id:null,reactions:{},pinned:false,edited:false};
    mutate(d=>{(d.msgs[key]=d.msgs[key]||[]).push(msg)});
    setReplying(null);
    sfx('sent');
    if(isDM&&contact)scheduleReply(contact.id,key);
  };
  const updMsg=(id,fn)=>{const key=ui.chat;mutate(d=>{const m=(d.msgs[key]||[]).find(x=>x.id===id);if(m)fn(m,d)})};
  const react=(id,emoji)=>{
    updMsg(id,m=>{
      const arr=m.reactions[emoji]||[];
      const next=arr.includes('me')?arr.filter(x=>x!=='me'):[...arr,'me'];
      if(next.length)m.reactions[emoji]=next;else delete m.reactions[emoji];
    });
  };
  const del=id=>{
    const key=ui.chat;
    mutate(d=>{d.msgs[key]=(d.msgs[key]||[]).filter(m=>m.id!==id)});
    if(editing&&editing.id===id)setEditing(null);
    if(replying&&replying.id===id)setReplying(null);
  };
  const pin=id=>updMsg(id,m=>{m.pinned=!m.pinned});
  const vote=(id,idx)=>updMsg(id,m=>{
    const had=m.poll.options[idx].votes.includes('me');
    m.poll.options.forEach(o=>{o.votes=o.votes.filter(v=>v!=='me')});
    if(!had)m.poll.options[idx].votes.push('me');
  });
  const saveEdit=(id,text)=>{updMsg(id,m=>{m.text=text;m.edited=true});setEditing(null)};
  const jump=id=>{
    const el=document.getElementById('msg-'+id);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    setFlash(id);
    setTimeout(()=>setFlash(f=>f===id?null:f),1400);
  };

  /* ---- contatos ---- */
  const addContact=p=>mutate(d=>{
    if(!d.contacts.some(c=>c.id===p.id))d.contacts.push({...p,alias:''});
    d.blocked=d.blocked.filter(x=>x!==p.id);
  });
  const blockContact=id=>mutate(d=>{
    d.contacts=d.contacts.filter(c=>c.id!==id);
    if(!d.blocked.includes(id))d.blocked.push(id);
  });
  const unblock=id=>mutate(d=>{
    d.blocked=d.blocked.filter(x=>x!==id);
    const p=PROFILES.find(x=>x.id===id);
    if(p&&!d.contacts.some(c=>c.id===id))d.contacts.push({...p,alias:''});
  });

  /* ---- arquivos (colar, arrastar, anexar) ---- */
  const handleFile=async f=>{
    if(!f||!f.type.startsWith('image/')){showToast('Arquivo não suportado. Envie imagens (PNG, JPG, GIF ou WEBP).');return}
    try{
      let data=await readFile(f);
      if(f.type==='image/gif'){setPending({type:'gif',data});return}
      if(S.imageCompress==='optimized')data=await resizeImage(data,1600,0.82);
      setPending({type:'image',data});
    }catch(e){showToast('Não foi possível carregar a imagem')}
  };

  const resetAll=()=>{
    localStorage.removeItem(KEY);
    setDb(seedDb());
    setUi({chat:'dm:ECO#1001',rightOpen:true,modal:null,settingsTab:'perfil',navQuery:'',navFilter:'todas',navOpen:false,spaceMode:'create',spaceId:null});
    setPending(null);
    showToast('Padrões de fábrica restaurados');
  };

  const ctx={
    db,S,ui,setUi,closeModal,goChat,mutate,showToast,toast,people,nameOf,typing,msgs,valid,isDM,contact,space,channel,chatTitle,
    sendPayload,react,del,pin,vote,saveEdit,editing,setEditing,replying,setReplying,flash,jump,
    menu,setMenu,lightbox,setLightbox,pinOpen,setPinOpen,panel,setPanel,pending,setPending,handleFile,
    addContact,blockContact,unblock,resetAll
  };

  const cls=['eco',S.density==='compact'?'compact':'',S.avatarShape==='squircle'?'squircle':'',`bubble-${S.bubble}`,S.reduceMotion?'rm':'',S.highContrast?'hc':''].join(' ');
  const vars={'--bg-canvas':T.canvas,'--bg-rail':T.rail,'--bg-sidebar':T.sidebar,'--bg-elev':T.elevated,'--bg-hover':T.hover,'--accent':S.accent,'--accent-soft':S.accent+'33','--fs':S.fontSize+'px'};

  return <Ctx.Provider value={ctx}>
    <div className={cls} style={vars}>
      <LeftRail/>
      <NavSidebar/>
      <ChatArea/>
      {valid&&ui.rightOpen&&<RightPanel/>}
      {ui.modal==='add'&&<AddModal/>}
      {ui.modal==='spaces'&&<SpaceModal/>}
      {ui.modal==='settings'&&<SettingsModal/>}
      {ui.modal==='quick'&&<QuickModal/>}
      {ui.modal==='poll'&&<PollModal/>}
      {ui.modal==='gallery'&&<GalleryModal/>}
      <Lightbox/>
      <ContextMenu/>
      {toast&&<div className="toast" key={toast.id} role="status">{toast.msg}</div>}
    </div>
  </Ctx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
